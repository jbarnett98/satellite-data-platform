<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Satellite Globe</title>

  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>

  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
    }

    #filterPanel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 360px;
      background: rgba(15, 23, 42, 0.82);
      color: #e2e8f0;
      padding: 14px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    #panelTitle {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }

    .controlRow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .buttonRow {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .panelButton {
      background: rgba(34, 211, 238, 0.12);
      color: #cffafe;
      border: 1px solid rgba(34, 211, 238, 0.28);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .panelButton:hover {
      background: rgba(34, 211, 238, 0.18);
      border-color: rgba(34, 211, 238, 0.4);
      transform: translateY(-1px);
    }

    .panelButton.active {
      background: rgba(34, 211, 238, 0.22);
      border-color: rgba(103, 232, 249, 0.55);
    }

    #satelliteInfo {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    #satelliteInfo strong {
      display: block;
      margin-bottom: 6px;
      color: #f8fafc;
      font-size: 14px;
    }

    .muted {
      color: #94a3b8;
    }

    input[type="checkbox"] {
      accent-color: #22d3ee;
      cursor: pointer;
    }

    .label {
      color: #94a3b8;
    }

    .value {
      color: #e2e8f0;
    }

    #loadingOverlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(8px);
    }

    #loadingCard {
      min-width: 280px;
      max-width: 420px;
      padding: 18px 20px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      color: #e2e8f0;
    }

    #loadingTitle {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    #loadingStatus {
      font-size: 13px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>
  <div id="filterPanel">
    <div id="panelTitle">Satellite Tracker</div>

    <div class="controlRow">
      <input type="checkbox" id="toggleStarlink" checked />
      <label for="toggleStarlink">Show Starlink</label>
    </div>

    <div class="buttonRow">
      <button id="resetViewButton" class="panelButton">Reset View</button>
      <button id="toggleAnimationButton" class="panelButton">Pause Animation</button>
      <button id="centerEarthButton" class="panelButton">Center Earth</button>
      <button id="centerSelectedButton" class="panelButton">Center Selected</button>
    </div>

    <div id="satelliteInfo">
      <strong>Selected satellite</strong>
      <span class="muted">Click a satellite to inspect its orbit.</span>
    </div>
  </div>

  <div id="loadingOverlay">
    <div id="loadingCard">
      <div id="loadingTitle">Loading satellite data…</div>
      <div id="loadingStatus">Starting up</div>
    </div>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJjZTc2ZDhlMS1kOGMyLTRlODYtODkzMi0xMTY4ODQ5MDQ3YjgiLCJpZCI6NDE1MjI4LCJpYXQiOjE3NzU5ODEzMDV9.g4q42Fnd8K8dYHEJPzyP9hCZZaPzDHkrL7wgKX5OE0s";

    const API_BASE_URL = "https://sa-b3a4209248f442df867133e8e8fa983e.ecs.eu-west-2.on.aws";
    const TRAJECTORY_REFRESH_MS = 3 * 60 * 1000;
    const HOVER_PICK_WIDTH = 12;
    const HOVER_PICK_HEIGHT = 12;

    async function initCesium() {
      try {
        const terrainProvider = await Cesium.createWorldTerrainAsync();

        const viewer = new Cesium.Viewer("cesiumContainer", {
          terrainProvider,
          animation: false,
          timeline: false,
          baseLayerPicker: false,
          geocoder: false,
          homeButton: true,
          sceneModePicker: false,
          navigationHelpButton: false,
          fullscreenButton: true,
          selectionIndicator: true,
          infoBox: false,
          shouldAnimate: true
        });

        viewer.scene.globe.translucency.enabled = false;
        viewer.scene.globe.enableLighting = true;
        viewer.scene.globe.dynamicAtmosphereLighting = true;
        viewer.scene.globe.showGroundAtmosphere = true;
        viewer.scene.globe.depthTestAgainstTerrain = false;
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.scene.sun.show = true;
        viewer.scene.moon.show = false;
        viewer.scene.skyAtmosphere.show = true;

        // Uncomment when your skybox files are ready
        // viewer.scene.skyBox = new Cesium.SkyBox({
        //   sources: {
        //     positiveX: "./skybox/px.jpg",
        //     negativeX: "./skybox/nx.jpg",
        //     positiveY: "./skybox/py.jpg",
        //     negativeY: "./skybox/ny.jpg",
        //     positiveZ: "./skybox/pz.jpg",
        //     negativeZ: "./skybox/nz.jpg"
        //   }
        // });

        viewer.imageryLayers.removeAll();

        const nightLayer = await Cesium.IonImageryProvider.fromAssetId(3812);
        viewer.imageryLayers.addImageryProvider(nightLayer);

        const imageryLayer = viewer.imageryLayers.get(0);
        imageryLayer.brightness = 1.2;
        imageryLayer.contrast = 1.1;
        imageryLayer.gamma = 0.9;

        const infoBox = document.getElementById("satelliteInfo");
        const toggle = document.getElementById("toggleStarlink");
        const resetViewButton = document.getElementById("resetViewButton");
        const toggleAnimationButton = document.getElementById("toggleAnimationButton");
        const centerEarthButton = document.getElementById("centerEarthButton");
        const centerSelectedButton = document.getElementById("centerSelectedButton");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const loadingStatus = document.getElementById("loadingStatus");

        const satelliteEntities = [];
        const satelliteEntityMap = new Map();

        let orbitPathEntity = null;
        let hoveredSatelliteEntity = null;
        let selectedSatelliteEntity = null;
        let animatedSatelliteEntity = null;
        let selectedAnimationTimer = null;
        let currentOrbitPathData = [];
        let animationPaused = false;

        const COLORS = {
          normal: Cesium.Color.fromCssColorString("#F8FAFC").withAlpha(0.96),
          starlink: Cesium.Color.fromCssColorString("#E0F2FE").withAlpha(1.0),
          hoverOutline: Cesium.Color.fromCssColorString("#FFFFFF").withAlpha(1.0),
          selected: Cesium.Color.fromCssColorString("#67E8F9"),
          orbit: Cesium.Color.fromCssColorString("#22D3EE").withAlpha(1.0),
          animated: Cesium.Color.fromCssColorString("#FFFFFF")
        };

        function setLoadingStatus(message) {
          if (loadingStatus) {
            loadingStatus.textContent = message;
          }
        }

        function hideLoadingOverlay() {
          if (loadingOverlay) {
            loadingOverlay.style.display = "none";
          }
        }

        function kmToCartesian(point) {
          return new Cesium.Cartesian3(
            Number(point.x_km) * 1000,
            Number(point.y_km) * 1000,
            Number(point.z_km) * 1000
          );
        }

        function defaultColorForEntity(entity) {
          const category = entity.properties?.category?.getValue?.();
          return category === "starlink" ? COLORS.starlink : COLORS.normal;
        }

        function updateInfoPanelDefault() {
          infoBox.innerHTML = `
            <strong>Selected satellite</strong>
            <span class="muted">Click a satellite to inspect its orbit.</span>
          `;
        }

        function updateInfoPanel(sat) {
          infoBox.innerHTML = `
            <strong>${sat.object_name || sat.satellite || "Unknown satellite"}</strong>
            <div><span class="label">NORAD ID:</span> <span class="value">${sat.norad_id ?? "N/A"}</span></div>
            <div><span class="label">Object ID:</span> <span class="value">${sat.object_id ?? "N/A"}</span></div>
            <div><span class="label">Object type:</span> <span class="value">${sat.object_type ?? "N/A"}</span></div>
            <div><span class="label">Owner:</span> <span class="value">${sat.owner ?? "N/A"}</span></div>
            <div><span class="label">Launch date:</span> <span class="value">${sat.launch_date ?? "N/A"}</span></div>
            <div><span class="label">Launch site:</span> <span class="value">${sat.launch_site ?? "N/A"}</span></div>
            <div><span class="label">Orbit type:</span> <span class="value">${sat.orbit_type ?? "N/A"}</span></div>
            <div><span class="label">Altitude:</span> <span class="value">${sat.altitude_km != null ? Number(sat.altitude_km).toFixed(1) : "N/A"} km</span></div>
            <div><span class="label">Apogee:</span> <span class="value">${sat.apogee_km ?? "N/A"} km</span></div>
            <div><span class="label">Perigee:</span> <span class="value">${sat.perigee_km ?? "N/A"} km</span></div>
            <div><span class="label">Inclination:</span> <span class="value">${sat.catalog_inclination_deg != null ? Number(sat.catalog_inclination_deg).toFixed(2) : "N/A"}°</span></div>
          `;
        }

        function flyToEuropeView(duration = 1.8) {
          viewer.trackedEntity = undefined;
          viewer.camera.flyTo({
            destination: Cesium.Rectangle.fromDegrees(-25, -30, 55, 60),
            duration
          });
        }

        function clearOrbitPath() {
          if (orbitPathEntity) {
            viewer.entities.remove(orbitPathEntity);
            orbitPathEntity = null;
          }
        }

        function stopSelectedAnimation() {
          if (selectedAnimationTimer) {
            clearInterval(selectedAnimationTimer);
            selectedAnimationTimer = null;
          }
        }

        function removeAnimatedSatellite() {
          stopSelectedAnimation();

          if (animatedSatelliteEntity) {
            viewer.entities.remove(animatedSatelliteEntity);
            animatedSatelliteEntity = null;
          }

          currentOrbitPathData = [];
        }

        function applyDefaultStyle(entity) {
          entity.point.pixelSize = 2;
          entity.point.color = defaultColorForEntity(entity);
          entity.point.outlineColor = Cesium.Color.WHITE.withAlpha(0.18);
          entity.point.outlineWidth = 1;
        }

        function applyHoverStyle(entity) {
          entity.point.pixelSize = 3;
          entity.point.color = defaultColorForEntity(entity);
          entity.point.outlineColor = COLORS.hoverOutline;
          entity.point.outlineWidth = 3;
        }

        function applySelectedStyle(entity) {
          entity.point.pixelSize = 4;
          entity.point.color = COLORS.selected;
          entity.point.outlineColor = Cesium.Color.WHITE;
          entity.point.outlineWidth = 3;
        }

        function restoreAllSatellitesAppearance() {
          satelliteEntities.forEach((entity) => {
            const isStarlinkVisible =
              toggle.checked || entity.properties?.category?.getValue?.() !== "starlink";

            entity.show = isStarlinkVisible;
            applyDefaultStyle(entity);
          });
        }

        function clearHoverState() {
          if (!hoveredSatelliteEntity || hoveredSatelliteEntity === selectedSatelliteEntity) {
            hoveredSatelliteEntity = null;
            return;
          }

          applyDefaultStyle(hoveredSatelliteEntity);
          hoveredSatelliteEntity = null;
        }

        function setHoverState(entity) {
          if (!entity || entity === selectedSatelliteEntity) {
            return;
          }

          if (hoveredSatelliteEntity === entity) {
            return;
          }

          clearHoverState();
          hoveredSatelliteEntity = entity;
          applyHoverStyle(entity);
        }

        function resetPreviousSelection() {
          if (!selectedSatelliteEntity) {
            return;
          }

          applyDefaultStyle(selectedSatelliteEntity);
          selectedSatelliteEntity = null;
        }

        function updateAnimationButtonState() {
          if (animationPaused) {
            toggleAnimationButton.textContent = "Resume Animation";
            toggleAnimationButton.classList.add("active");
          } else {
            toggleAnimationButton.textContent = "Pause Animation";
            toggleAnimationButton.classList.remove("active");
          }
        }

        function resetView() {
          clearOrbitPath();
          removeAnimatedSatellite();
          clearHoverState();
          resetPreviousSelection();
          restoreAllSatellitesAppearance();
          updateInfoPanelDefault();

          animationPaused = false;
          updateAnimationButtonState();
          viewer.clock.shouldAnimate = true;

          viewer.trackedEntity = undefined;
          flyToEuropeView();
        }

        function addSatellite(sat) {
          if (
            sat == null ||
            sat.satellite == null ||
            sat.x_km == null ||
            sat.y_km == null ||
            sat.z_km == null ||
            sat.norad_id == null
          ) {
            return;
          }

          const x = Number(sat.x_km);
          const y = Number(sat.y_km);
          const z = Number(sat.z_km);

          if (Number.isNaN(x) || Number.isNaN(y) || Number.isNaN(z)) {
            return;
          }

          const isStarlink = sat.satellite.toLowerCase().includes("starlink");
          const initialPosition = kmToCartesian(sat);

          const entity = viewer.entities.add({
            name: sat.satellite,
            position: initialPosition,
            point: {
              pixelSize: 2,
              color: isStarlink ? COLORS.starlink : COLORS.normal,
              outlineColor: Cesium.Color.WHITE.withAlpha(0.18),
              outlineWidth: 1,
              scaleByDistance: new Cesium.NearFarScalar(
                2_000_000.0, 1.8,
                30_000_000.0, 0.7
              )
            },
            properties: {
              satellite: sat.satellite ?? null,
              norad_id: sat.norad_id ?? null,
              orbit_type: sat.orbit_type ?? null,
              altitude_km: sat.altitude_km ?? null,
              category: isStarlink ? "starlink" : "other"
            }
          });

          satelliteEntities.push(entity);
          satelliteEntityMap.set(Number(sat.norad_id), entity);
        }

        async function fetchAllSatellites() {
          const response = await fetch(`${API_BASE_URL}/satellites`);

          if (!response.ok) {
            throw new Error(`API request failed with status ${response.status}`);
          }

          return await response.json();
        }

        async function fetchSatelliteTrajectories() {
          const response = await fetch(`${API_BASE_URL}/satellite-trajectories`);

          if (!response.ok) {
            throw new Error(`Trajectory request failed with status ${response.status}`);
          }

          return await response.json();
        }

        function buildSampledPosition(samples) {
          const property = new Cesium.SampledPositionProperty();

          for (const [timestamp, x_km, y_km, z_km] of samples) {
            const time = Cesium.JulianDate.fromDate(new Date(timestamp));
            const position = new Cesium.Cartesian3(
              Number(x_km) * 1000,
              Number(y_km) * 1000,
              Number(z_km) * 1000
            );

            property.addSample(time, position);
          }

          property.setInterpolationOptions({
            interpolationDegree: 1,
            interpolationAlgorithm: Cesium.LinearApproximation
          });

          return property;
        }

        function applyTrajectoryData(payload) {
          if (!payload || !payload.satellites) {
            return;
          }

          for (const sat of payload.satellites) {
            const entity = satelliteEntityMap.get(Number(sat.norad_id));
            if (!entity || !sat.samples || sat.samples.length === 0) {
              continue;
            }

            entity.position = buildSampledPosition(sat.samples);
          }

          if (payload.generated_at) {
            viewer.clock.currentTime = Cesium.JulianDate.fromDate(new Date(payload.generated_at));
          }

          viewer.clock.shouldAnimate = !animationPaused;
          viewer.clock.multiplier = 1;
        }

        function startTrajectoryRefresh() {
          setInterval(async () => {
            try {
              const trajectoryPayload = await fetchSatelliteTrajectories();
              applyTrajectoryData(trajectoryPayload);
              console.log("Trajectory refresh complete");
            } catch (err) {
              console.error("Error refreshing trajectories:", err);
            }
          }, TRAJECTORY_REFRESH_MS);
        }

        function getClosestPointToNow(pathPoints) {
          const now = Date.now();

          let closestPoint = pathPoints[0];
          let smallestDiff = Math.abs(new Date(pathPoints[0].timestamp).getTime() - now);

          for (const point of pathPoints) {
            const diff = Math.abs(new Date(point.timestamp).getTime() - now);
            if (diff < smallestDiff) {
              smallestDiff = diff;
              closestPoint = point;
            }
          }

          return closestPoint;
        }

        function createAnimatedSatelliteFromPath(sat, pathPoints) {
          if (!pathPoints || pathPoints.length === 0) {
            return;
          }

          removeAnimatedSatellite();

          const closestPoint = getClosestPointToNow(pathPoints);

          animatedSatelliteEntity = viewer.entities.add({
            name: `${sat.satellite} (Live)`,
            position: kmToCartesian(closestPoint),
            point: {
              pixelSize: 9,
              color: COLORS.animated,
              outlineColor: COLORS.selected,
              outlineWidth: 2
            }
          });
        }

        function stepSelectedAnimation() {
          if (!animatedSatelliteEntity || currentOrbitPathData.length === 0) {
            return;
          }

          const closestPoint = getClosestPointToNow(currentOrbitPathData);
          animatedSatelliteEntity.position = kmToCartesian(closestPoint);
        }

        function startSelectedAnimation() {
          if (animationPaused) {
            return;
          }

          if (!animatedSatelliteEntity || currentOrbitPathData.length === 0) {
            return;
          }

          stopSelectedAnimation();
          stepSelectedAnimation();
          selectedAnimationTimer = setInterval(stepSelectedAnimation, 1000);
        }

        async function fetchSatelliteDetails(noradId) {
          const response = await fetch(`${API_BASE_URL}/satellites/${noradId}`);

          if (!response.ok) {
            throw new Error(`Satellite detail request failed with status ${response.status}`);
          }

          return await response.json();
        }

        async function loadOrbitPath(noradId, sat) {
          try {
            const response = await fetch(`${API_BASE_URL}/satellites/${noradId}/orbit-path`);

            if (!response.ok) {
              throw new Error(`Orbit path request failed with status ${response.status}`);
            }

            const data = await response.json();

            clearOrbitPath();
            removeAnimatedSatellite();

            const validPoints = data.points.filter((point) =>
              point.x_km != null &&
              point.y_km != null &&
              point.z_km != null
            );

            const pathPositions = validPoints.map((point) => kmToCartesian(point));

            if (pathPositions.length === 0) {
              console.warn("No valid Cartesian orbit path points returned.");
              return;
            }

            orbitPathEntity = viewer.entities.add({
              name: `${data.satellite} Orbit Path`,
              polyline: {
                positions: pathPositions,
                width: 3,
                material: new Cesium.PolylineGlowMaterialProperty({
                  glowPower: 0.15,
                  color: COLORS.orbit
                }),
                clampToGround: false
              }
            });

            currentOrbitPathData = validPoints;
            createAnimatedSatelliteFromPath(sat, validPoints);
            startSelectedAnimation();
          } catch (err) {
            console.error("Failed to load orbit path:", err);
          }
        }

        try {
          setLoadingStatus("Loading current satellite catalog...");
          const satelliteData = await fetchAllSatellites();
          satelliteData.forEach(addSatellite);

          setLoadingStatus("Loading trajectory samples...");
          const trajectoryPayload = await fetchSatelliteTrajectories();
          applyTrajectoryData(trajectoryPayload);

          flyToEuropeView(0);
          startTrajectoryRefresh();
          hideLoadingOverlay();
        } catch (err) {
          console.error("Error loading satellites:", err);
          setLoadingStatus(`Failed to load data: ${err.message}`);
        }

        toggle.addEventListener("change", () => {
          clearHoverState();

          if (selectedSatelliteEntity) {
            applySelectedStyle(selectedSatelliteEntity);
            selectedSatelliteEntity.show =
              toggle.checked || selectedSatelliteEntity.properties?.category?.getValue?.() !== "starlink";
          }

          restoreAllSatellitesAppearance();

          if (selectedSatelliteEntity) {
            applySelectedStyle(selectedSatelliteEntity);
          }
        });

        resetViewButton.addEventListener("click", () => {
          resetView();
        });

        toggleAnimationButton.addEventListener("click", () => {
          animationPaused = !animationPaused;
          updateAnimationButtonState();

          viewer.clock.shouldAnimate = !animationPaused;

          if (animationPaused) {
            stopSelectedAnimation();
          } else {
            startSelectedAnimation();
          }
        });

        centerEarthButton.addEventListener("click", () => {
          flyToEuropeView(1.5);
        });

        centerSelectedButton.addEventListener("click", () => {
          const target = animatedSatelliteEntity || selectedSatelliteEntity;
          if (!target) {
            return;
          }

          viewer.trackedEntity = undefined;
          viewer.flyTo(target, {
            duration: 1.5
          });
        });

        const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

        handler.setInputAction(function (movement) {
          const pickedObject = viewer.scene.pick(
            movement.endPosition,
            HOVER_PICK_WIDTH,
            HOVER_PICK_HEIGHT
          );

          if (!Cesium.defined(pickedObject) || !pickedObject.id) {
            clearHoverState();
            return;
          }

          const entity = pickedObject.id;
          const props = entity.properties;

          if (!props || !props.norad_id) {
            clearHoverState();
            return;
          }

          setHoverState(entity);
        }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

        handler.setInputAction(async function (click) {
          const hoveredEntity = hoveredSatelliteEntity;
          let entity = hoveredEntity;

          if (!entity) {
            const pickedObject = viewer.scene.pick(
              click.position,
              HOVER_PICK_WIDTH,
              HOVER_PICK_HEIGHT
            );

            if (!Cesium.defined(pickedObject) || !pickedObject.id) {
              return;
            }

            entity = pickedObject.id;
          }

          const props = entity.properties;

          if (!props || !props.norad_id) {
            return;
          }

          const sat = {
            satellite: props.satellite ? props.satellite.getValue() : entity.name,
            norad_id: props.norad_id.getValue(),
            orbit_type: props.orbit_type ? props.orbit_type.getValue() : null,
            altitude_km: props.altitude_km ? props.altitude_km.getValue() : null
          };

          clearOrbitPath();
          removeAnimatedSatellite();
          clearHoverState();
          resetPreviousSelection();

          selectedSatelliteEntity = entity;
          applySelectedStyle(entity);

          try {
            const detailedSat = await fetchSatelliteDetails(sat.norad_id);
            updateInfoPanel(detailedSat);
          } catch (err) {
            console.error("Failed to load satellite details:", err);
            updateInfoPanel(sat);
          }

          await loadOrbitPath(sat.norad_id, sat);
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        updateInfoPanelDefault();
        updateAnimationButtonState();

      } catch (err) {
        console.error("Failed to initialize Cesium:", err);
      }
    }

    initCesium();
  </script>
</body>
</html>
